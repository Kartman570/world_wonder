<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка движения толпы</title><style>body{margin:0;background:#12241e;color:#e3dcc5;font:14px system-ui}main{max-width:1100px;margin:24px auto}h1{font:30px Georgia;margin:0 0 10px}p{color:#b0b9a3}button{background:#263e32;color:#e3dcc5;border:1px solid #a38e5a;padding:10px 16px;margin-right:8px;cursor:pointer}canvas{display:block;background:#66765b;width:100%;height:auto;max-height:calc(100vh - 235px);object-fit:contain;margin-top:16px}#status{padding:14px;background:#20362b;margin-top:12px}</style><main><h1>Встречные потоки и задержание</h1><p>Проверка настоящей физики игры: обход справа, уступание в узком проходе и контакт любого стражника.</p><nav><button id="crowd">Две толпы</button><button id="door">Узкие ворота</button><button id="arrest">Задержание за стеной</button></nav><div id="status"></div><canvas id="view" width="1100" height="600"></canvas></main><script type="module">
import {World,TILE,W} from './simulation.js';import {drawCharacter} from './character-sprites.js';import {lawActorAI,recordCrime} from './law.js';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),status=document.querySelector('#status');let world,actors=[],mode,accumulator=0,last=0,contacts=0,finished=false;
function reset(kind){world=new World('crowd-fixture');world.entities=[];world.cities=[];world.prisons=[];world.prisonGateGrid.clear();world.player.x=100;world.player.y=100;world.respawn={x:0,y:0};for(let y=180;y<225;y++)for(let x=180;x<225;x++){const i=y*W+x;world.tiles[i]=3;world.solids[i]=0;world.walls[i]=0;world.roomGrid[i]=0;}mode=kind;actors=[];accumulator=0;contacts=0;finished=false;
if(kind==='arrest'){Object.assign(world.player,{x:200.5*TILE,y:200.5*TILE,weaponDrawn:false});world.cities=[{id:'oak',x:200,y:200,rx:25,ry:25}];const blocked=world.add('guard','oak',202.5,200.5,'Ближайший за стеной'),reachable=world.add('guard','oak',200.5,204,'Стражник со свободным подходом');actors=[blocked,reachable];world.solids[200*W+201]=1;world.walls[200*W+201]=1;recordCrime(world,'oak','weapon');world.onDetention=()=>{contacts++;finished=true;};}
else{if(kind==='door')for(let y=180;y<225;y++)if(y!==200){world.solids[y*W+200]=1;world.walls[y*W+200]=1;}for(const side of [-1,1])for(let i=0;i<(kind==='door'?3:12);i++){const e=world.add('citizen',side===-1?'oak':'salt',kind==='door'?200+side*(2+i*.8)+.5:200+side*(4+Math.floor(i/4)*.7),kind==='door'?200.5:200+(i%4-1.5)*.7);e.goal={x:kind==='door'?(200-side*(4+i*.8))*TILE+24:(200-side*(6+Math.floor(i/4)*.7))*TILE,y:e.y};e.livery=side===-1?'#bdac7d':'#7fadb2';actors.push(e);}}world.rebuildSpatial();}
for(const id of ['crowd','door','arrest'])document.querySelector('#'+id).onclick=()=>reset(id);reset('crowd');
function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;accumulator+=dt;if(!finished)while(accumulator>=.15){world.elapsed+=.15;world.rebuildSpatial();for(const e of actors){if(mode==='arrest')lawActorAI(world,e,.15);else if(Math.hypot(e.x-e.goal.x,e.y-e.goal.y)>16)world.move(e,e.goal.x,e.goal.y,90,.15);}accumulator-=.15;}
c.clearRect(0,0,1100,600);c.fillStyle='#66765b';c.fillRect(0,0,1100,600);c.save();c.translate(550,320);c.translate(-200*TILE,-200*TILE);if(mode==='door'){c.fillStyle='#bac0a4';c.fillRect(200*TILE,180*TILE,TILE,20*TILE);c.fillRect(200*TILE,201*TILE,TILE,24*TILE);}if(mode==='arrest'){c.fillStyle='#c4bb9e';c.fillRect(201*TILE,200*TILE,TILE,TILE);drawCharacter(c,world.player,world.player,{player:true});}
for(const e of [...actors].sort((a,b)=>a.y-b.y)){c.fillStyle=e.faction==='oak'?'#dcc286':'#a7d4d5';c.beginPath();c.ellipse(e.x,e.y+3,13,6,0,0,Math.PI*2);c.fill();drawCharacter(c,e,e);if(mode==='arrest'){c.font='12px system-ui';c.textAlign='center';c.fillStyle='#f4e6bc';c.fillText(e.name,e.x,e.y-92);}}c.restore();
const arrived=actors.filter(e=>e.goal&&Math.hypot(e.x-e.goal.x,e.y-e.goal.y)<25).length;if(mode!=='arrest'&&arrived===actors.length)finished=true;status.textContent=mode==='arrest'?(world.detention?'Диалог начал: '+world.entityById.get(world.detention.guard).name+' · разговоров: '+contacts:'Оба стражника пытаются подойти. Ближайшему мешает стена.'):'Прибыли: '+arrived+' / '+actors.length+' · NPC сохраняют твёрдые коллизии · время '+world.elapsed.toFixed(1)+' с';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
