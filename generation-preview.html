<!doctype html><html lang="ru"><meta charset="utf-8"><title>Водосборы и кварталы</title><link rel="stylesheet" href="style.css"><style>body{overflow:auto;background:#15221d;color:#dfd4b7;padding:24px}main{max-width:1450px;margin:auto}canvas{width:100%;height:auto;border:1px solid #7d866b66;background:#1e3029}section{margin-top:24px}.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:18px}small{display:block;color:#a8b3a1;margin:8px 0}input{max-width:200px}#status{min-height:24px}</style><main><div class="eyebrow">АЛЬФА 13 · ПРОВЕРКА ГЕНЕРАТОРА</div><h1>Водосборы и городские кварталы</h1><div class="toolbar"><label>Зерно <input id="seed" value="734291"></label><button id="generate">Создать регион</button><button id="play">Играть в этом проверочном мире</button></div><p id="status"></p><canvas id="region" width="1280" height="960"></canvas><div id="cities" class="cities"></div></main><script type="module">
import {World,W,H} from './simulation.js';import {Expedition} from './expedition.js';import {biomeColor} from './regional-terrain.js';
let world;const $=s=>document.querySelector(s),colors=['#35513b','#89805a','#335d65','#969778','#396b79','#ad976e','#7d8a50','#21252d','#89945c','#456151','#8b887b','#586b70','#b4b4a2','#83745d','#93866c','#bba376','#796289','#5e6270','#8c9a92'];
function render(){const start=performance.now();try{world=new World($('#seed').value);const image=document.createElement('canvas');image.width=W;image.height=H;const c=image.getContext('2d'),pixels=c.createImageData(W,H);for(let i=0;i<W*H;i++){const color=biomeColor(world,i)||colors[world.tiles[i]];pixels.data[i*4]=parseInt(color.slice(1,3),16);pixels.data[i*4+1]=parseInt(color.slice(3,5),16);pixels.data[i*4+2]=parseInt(color.slice(5,7),16);pixels.data[i*4+3]=255;}c.putImageData(pixels,0,0);for(const b of world.buildings){c.fillStyle=b.style?.[b.type==='wall'?'wall':'house']||'#b3b19d';c.fillRect(b.x,b.y,b.w,b.h);}const out=$('#region').getContext('2d');out.drawImage(image,0,0);out.font='bold 13px system-ui';out.textAlign='center';for(const p of [...world.cities,world.places.find(z=>z.id==='cathedral')]){out.fillStyle='#111c16';out.fillText(p.name,p.x,p.y-p.r-8);out.fillStyle='#e3d5ac';out.fillText(p.name,p.x,p.y-p.r-9);}$('#cities').replaceChildren();for(const z of world.cities){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=z.name;const caption=document.createElement('small');caption.textContent=({capital:'Большой город',town:'Город',village:'Деревня'})[z.kind]+' · '+z.wardPlan.wards.length+' кварталов · '+z.houseCount+' домов';const canvas=document.createElement('canvas');canvas.width=canvas.height=600;const context=canvas.getContext('2d'),size=Math.max(z.rx,z.ry)*2+16;context.imageSmoothingEnabled=false;context.drawImage(image,z.x-size/2,z.y-size/2,size,size,0,0,600,600);section.append(title,caption,canvas);$('#cities').append(section);}$('#status').textContent='Рек и участков: '+world.riverPaths.length+' · Естественных озёр: '+world.lakes.length+' · Генерация: '+Math.round(performance.now()-start)+' мс · Старые сохранения используют прежний генератор.';}catch(error){$('#status').textContent=error.stack;}}
$('#generate').onclick=render;$('#play').onclick=()=>{try{localStorage.setItem('ashen-road-save:qa-generation-preview',new Expedition(world).save());location.href='./?slot=qa-generation-preview';}catch(error){$('#status').textContent=error.message;}};render();
</script></html>
