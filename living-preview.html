<!doctype html><html lang="ru"><meta charset="utf-8"><title>Живой регион — лаборатория</title><link rel="stylesheet" href="style.css"><style>body{overflow:auto;background:#182520}main{max-width:1050px;margin:28px auto;padding:24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}#panel{padding:28px;background:#14211e;border:1px solid #73816b}canvas{width:100%;height:180px;background:#28382f;border:1px solid #65715b}#feedback{color:#e3c98c;min-height:28px}.recipe-card{margin:15px 0}button{cursor:pointer}h1{margin:12px 0}</style><main><div class="eyebrow">ОТДЕЛЬНЫЙ ТЕСТОВЫЙ МИР · БЕЗ СОХРАНЕНИЯ</div><h1>Город, который меняется</h1><p>Лаборатория использует игровые функции. Здесь заранее выданы материалы и репутация для проверки проектов и отряда. Ваше путешествие не затрагивается.</p><canvas id="preview" width="1000" height="180"></canvas><nav><button class="action" id="projects">Проекты</button><button class="action" id="party">Отряд</button><button class="action" id="hire">Нанять охотника</button><button class="action" id="work">60 секунд работы</button><button class="action" id="news">Регион</button></nav><p id="feedback" role="status"></p><section id="panel"></section></main><script type="module">
import {World} from './simulation.js';import {cityMemory} from './law.js';import {renderProjects} from './projects-ui.js';import {renderPartyPanel} from './party-ui.js';import {hireCompanion} from './companions.js';import {renderLivingPanel} from './living-ui.js';import {drawCharacter} from './character-sprites.js';import {drawIndustryProp} from './adventure-render.js';
const w=new World('living-laboratory'),z=w.cities[0],keeper=w.entities.find(e=>e.role==='quartermaster'&&e.faction===z.id),builder=w.entities.find(e=>e.projectBuilder&&e.faction===z.id),hunter=w.entities.find(e=>e.role==='hunter'&&e.faction===z.id),p=w.player;w.entities=[keeper,builder,hunter];p.inventory={gold:1800,planks:40,ingot:20,tools:2,cloth:20,medicine:12,leather:12,arrow:60,ration:6};p.weaponDrawn=false;Object.assign(p,{x:keeper.x,y:keeper.y});Object.assign(hunter,{x:keeper.x+25,y:keeper.y});cityMemory(w,z.id).reputation=40;w.rebuildSpatial();let tab='projects';const root=document.querySelector('#panel'),feedback=document.querySelector('#feedback'),notify=t=>feedback.textContent=t;function paint(){const c=document.querySelector('canvas').getContext('2d');c.clearRect(0,0,1000,180);c.fillStyle='#d6c796';c.font='14px Georgia';c.fillText('Плотник',45,25);c.fillText('Улучшенная мельница',235,25);c.fillText('Лечебница',490,25);c.fillText('Арсенал',715,25);drawCharacter(c,{...builder,x:90,y:160},{x:90,y:160,dir:1,walk:0});for(const[kind,x]of [['improvedMill',5.5],['clinicCabinet',10.8],['cityArmory',15.5]])drawIndustryProp(c,{kind,x,y:2});}function render(){if(tab==='projects')renderProjects(root,w,z.id,{notify,changed:paint,refresh:render});else if(tab==='party')renderPartyPanel(root,w,{notify,changed:paint,refresh:render});else renderLivingPanel(root,w);paint();}document.querySelector('#projects').onclick=()=>{tab='projects';render();};document.querySelector('#party').onclick=()=>{tab='party';render();};document.querySelector('#news').onclick=()=>{tab='news';render();};document.querySelector('#hire').onclick=()=>{notify(hireCompanion(w,hunter).message);tab='party';render();};document.querySelector('#work').onclick=()=>{for(let i=0;i<400;i++)w.update(.15);notify('Прошла минута рабочего времени. '+Math.round(w.player.inventory.gold)+' зол. в сумке.');render();};render();
</script></html>
