<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка журнала · много поручений</title><link rel="stylesheet" href="style.css"><style>body{background:#25372e}body>small{position:fixed;left:20px;top:15px;color:#c5ae78;z-index:5}#modal{background:#07100f80}</style><small>Проверка интерфейса · демонстрационные поручения · сохранение игры не используется</small><div id="modal"><section class="modal-card"><div id="preview"></div></section></div><script type="module">
import {renderJournal} from './exploration-ui.js';
const titles=['Шкуры для зимних плащей','Тишина на тракте','До следующих ворот','Железо для гарнизона','Лекарство для дозора','Пропавший подмастерье','Письмо за дальними воротами','Доски для новой пристани'];
const w={quests:Array.from({length:22},(_,i)=>({id:i,title:titles[i%8],giver:'smith',city:i%3,status:i<8?'active':i<20?'completed':'failed',reward:75+i*10})),cities:['Кремновец','Белоступ','Ольхоречье'].map((name,id)=>({id,name})),factionName:id=>['Кремновец','Белоступ','Ольхоречье'][id],questText:q=>'Принесите заказчику припасы. После возвращения поговорите с ним лично, чтобы сдать поручение и получить '+q.reward+' золотых. Заказчик ждёт внутри своей мастерской у восточной стены.',caravanStats:{arrived:12,lost:2},territories:[{name:'Северный лес',owner:1}],events:Array.from({length:30},(_,i)=>({time:i,text:'Караван прибыл к воротам города. Охрана осматривает повозки.'})),eventObservable:()=>true};
renderJournal(document.querySelector('#preview'),w,{relics:9,returned:2,openRelics:()=>{},openNotes:()=>{},cityMemory:(w,id)=>({reputation:10+id*5,history:[]}),warrant:()=>null,roleName:()=> 'Кузнец',formatTime:t=>'08:'+String(t).padStart(2,'0')});
</script></html>
