<!doctype html><meta charset="utf-8" /><title>Terrain — Blender materials and transitions</title>
<style>
  body {
    margin: 24px;
    background: #15261e;
    color: #d9cba9;
    font: 16px Georgia;
  }
  h1 {
    font-size: 24px;
  }
  canvas {
    max-width: 100%;
    border: 1px solid #8d815e;
  }
  #swatches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  figure {
    margin: 0;
  }
  figure img {
    width: 100%;
    image-rendering: pixelated;
  }
  figcaption {
    padding: 8px 0;
  }
</style>
<h1>Terrain: Forest → road → shore</h1>
<p id="status">Loading materials…</p>
<canvas id="scene" width="1536" height="960"></canvas>
<h1>Materials: seamless renders Blender</h1>
<div id="swatches"></div>
<script type="module">
  import { TerrainTextures } from '../../src/render/terrain-textures.js';
  import { RenderAssets } from '../../src/render/render-assets.js';
  import { SpriteSheets } from '../../src/render/sprite-sheets.js';
  import { EnvironmentSprites } from '../../src/render/environment-sprites.js';
  import { CanopyWindow } from '../../src/render/canopy-window.js';
  import { TILE, W } from '../../src/core/content.js';
  const terrain = new TerrainTextures(),
    sprites = new SpriteSheets({ maxBytes: 256 * 1024 * 1024 }),
    env = new EnvironmentSprites(sprites);
  await Promise.all([terrain.warm(), env.warm([{ role: 'player' }, { role: 'cityGuard' }])]);
  const w = {
    seed: 'terrain-preview',
    decor: [],
    tiles: new Uint8Array(W * 960),
    depth: new Uint8Array(W * 960),
    tile(x, y) {
      if (x > 24 + Math.sin(y * 0.24) * 1.8) return 4;
      if (x > 22 + Math.sin(y * 0.24) * 1.8) return 15;
      if (Math.abs(x - (13 + Math.sin(y * 0.25) * 1.4)) < 1.8) return 1;
      if (x < 11) return 0;
      return 8;
    },
  };
  for (let y = 0; y < 24; y++)
    for (let x = 0; x < 40; x++) {
      w.tiles[y * W + x] = w.tile(x, y);
      w.depth[y * W + x] = x < 9 ? 8 : 0;
    }
  const assets = new RenderAssets(w, { terrain }),
    canvas = document.querySelector('#scene'),
    c = canvas.getContext('2d');
  const before = performance.now();
  await assets.prepareGround({ left: 0, right: 1536, top: 0, bottom: 960 }, 1);
  assets.drawGround(c, { left: 0, right: 1536, top: 0, bottom: 960 }, 1, 0);
  const buildTime = performance.now() - before;
  const cutaway = new CanopyWindow(),
    player = { role: 'player', hp: 100 },
    guard = { role: 'cityGuard', hp: 100 };
  const floor = document.createElement('canvas');
  floor.width = canvas.width;
  floor.height = canvas.height;
  floor.getContext('2d').drawImage(canvas, 0, 0);
  const trees = [
    { x: 150, y: 240, s: 1.2 },
    { x: 350, y: 220, s: 1 },
    { x: 130, y: 500, s: 1.1 },
    { x: 350, y: 500, s: 1.25 },
    { x: 230, y: 790, s: 1 },
    { x: 460, y: 850, s: 1.2 },
  ];
  function draw(ms) {
    c.drawImage(floor, 0, 0);
    for (const t of trees)
      cutaway.draw(
        c,
        (cc) => env.draw(cc, 'oak', t.x, t.y, { scale: t.s }),
        env.bounds('oak', t.x, t.y, { scale: t.s }),
        { x: 650, y: 600 },
      );
    sprites.draw(c, player, { x: 650, y: 600, dir: 1, animation: 'idle' }, ms / 1000);
    sprites.draw(c, guard, { x: 690, y: 680, dir: 6, animation: 'idle' }, ms / 1000);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  for (const [id, m] of terrain.materials) {
    const figure = document.createElement('figure'),
      image = new Image();
    image.src = '../../graphics/terrain/sprites' + m.files[0];
    const caption = document.createElement('figcaption');
    caption.textContent = id;
    figure.append(image, caption);
    document.querySelector('#swatches').append(figure);
  }
  document.querySelector('#status').textContent =
    'Ready · ' +
    terrain.materials.size +
    ' materials · ' +
    Math.round(buildTime) +
    ' ms for the first chunk · ' +
    Math.round(terrain.metrics.decodedBytes / 1024 / 1024) +
    ' MiB of textures';
</script>
