<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Animals — Silhouettes and Eight Directions</title
  ><style>
    body {
      margin: 0;
      padding: 20px;
      background: #15271e;
      color: #ded7b8;
      font: 13px system-ui;
    }
    h1 {
      font: 26px Georgia;
      margin: 0 0 6px;
    }
    p {
      color: #a6b59e;
      margin: 0 0 10px;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 1200px;
      background: #53624b;
      border: 1px solid #b3a57955;
    }
    button {
      background: #344a37;
      border: 1px solid #a4976844;
      color: #e6d5a8;
      padding: 5px 12px;
      cursor: pointer;
      margin: 0 4px 10px 0;
    }
    button[aria-pressed='true'] {
      background: #9c895b;
      color: #14241c;
    }
  </style>
  <h1>Forest and Dungeon Creatures</h1>
  <p>The same sprites used in the game. Choose a direction:</p>
  <nav id="views"></nav>
  <canvas id="animals" width="1200" height="570"></canvas>
  <script type="module">
    import { ANIMALS } from '../../src/core/content.js';
    import { animalSprite } from '../../src/render/animal-sprites.js';
    const c = document.querySelector('canvas').getContext('2d');
    let frame = 0,
      dir = 0;
    for (const [i, label] of ['In', 'SE', 'S', 'SW', 'W', 'NW', 'From', 'NE'].entries()) {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-pressed', i === dir);
      b.onclick = () => {
        dir = i;
        for (const q of document.querySelectorAll('button'))
          q.setAttribute('aria-pressed', q === b);
      };
      document.querySelector('nav').append(b);
    }
    const roles = [
      'deer',
      'elk',
      'bear',
      'wolf',
      'hare',
      'fox',
      'boar',
      'lynx',
      'goat',
      'badger',
      'caveSpider',
      'caveBat',
    ];
    function draw() {
      c.fillStyle = '#53624b';
      c.fillRect(0, 0, 1200, 570);
      roles.forEach((role, i) => {
        const x = (i % 4) * 300,
          y = Math.floor(i / 4) * 190,
          a = ANIMALS[role];
        c.fillStyle = i % 2 ? '#ffffff06' : '#00000009';
        c.fillRect(x, y, 300, 190);
        c.fillStyle = '#f0e4bf';
        c.font = '16px system-ui';
        c.fillText(a.name, x + 18, y + 25);
        c.drawImage(animalSprite(role, dir, Math.floor(frame / 10)), x + 30, y - 3, 240, 200);
      });
      frame++;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</html>
