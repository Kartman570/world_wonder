<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Alien Basin Preview</title
  ><link rel="stylesheet" href="../../src/ui/game.css" />
  <body style="overflow: auto; background: #222536; color: #ded4e3; padding: 40px">
    <main style="max-width: 850px; margin: auto">
      <div class="eyebrow">ALPHA 11 LABORATORY</div>
      <h1>Alien Basin</h1>
      <p>
        Test scenarios in separate save slots. The main journey is unaffected. After choosing,
        select Continue Saved Journey.
      </p>
      <div id="scenes" class="actions"></div>
    </main>
    <script type="module">
      import { World, TILE } from '../../src/core/simulation.js';
      import { Expedition } from '../../src/core/expedition.js';
      const cleanup = document.createElement('button');
      cleanup.textContent = 'Delete Four Alpha 10 Test Saves';
      cleanup.onclick = () => {
        for (const id of ['stable', 'stock', 'webs', 'alert'])
          localStorage.removeItem('ashen-road-save:qa-field-' + id);
        cleanup.textContent = 'Alpha 10 test slots deleted';
      };
      document.querySelector('#scenes').append(cleanup);
      const scenes = {
        spider: {
          label: 'Spider · butchering and looting',
          run(w) {
            const p = w.player;
            w.corpses.push({
              id: ++w.id,
              x: p.x + 20,
              y: p.y,
              name: 'Cave Spider',
              animal: 'caveSpider',
              inventory: {},
              butchered: false,
              age: 0,
            });
          },
        },
        air: {
          label: 'Suffocation · pulsing violet haze',
          run(w) {
            const a = w.alienEcology.sites.find((s) => s.kind === 'arkFilter');
            Object.assign(w.player, {
              x: a.x + 120,
              y: a.y + 190,
              inventory: {},
              breathSuitWorn: false,
            });
          },
        },
        room: {
          label: 'Round House · interior',
          run(w) {
            const b = w.buildings.find((b) => b.type === 'arkVault');
            Object.assign(w.player, {
              x: b.workSpot.x,
              y: b.workSpot.y,
              inventory: { breathSuit: 1 },
              breathSuitWorn: true,
            });
          },
        },
        quarry: {
          label: 'Quarry · miner at work',
          run(w) {
            const site = w.alienEcology.sites.find((s) => s.kind === 'arkRock'),
              e = w.entities.find((e) => e.role === 'arctMiner');
            Object.assign(e, { x: site.x, y: site.y + 95, alienSite: site.id });
            Object.assign(w.player, {
              x: site.x + 100,
              y: site.y + 170,
              inventory: { breathSuit: 1, sword: 1 },
              breathSuitWorn: true,
            });
          },
        },
        sophos: {
          label: 'Sophos · handle confiscation',
          run(w) {
            const s = w.entities.find((e) => e.role === 'wizard');
            Object.assign(w.player, {
              x: s.x + 190,
              y: s.y + 80,
              inventory: { arkCutter: 1 },
              equipment: { melee: null, ranged: 'arkCutter' },
              weaponMode: 'ranged',
              weapon: 'arkCutter',
              weaponDrawn: true,
            });
          },
        },
        desert: {
          label: 'Wasteland · outsider remains',
          run(w) {
            const b = w.corpses.find((c) => c.desertRemains);
            Object.assign(w.player, { x: b.x, y: b.y + 100 });
            w.entities = w.entities.filter((e) => Math.hypot(e.x - b.x, e.y - b.y) > 1600);
          },
        },
      };
      for (const [id, scene] of Object.entries(scenes)) {
        const b = document.createElement('button');
        b.textContent = scene.label;
        b.onclick = () => {
          try {
            const w = new World('alien-ui-' + id);
            scene.run(w);
            w.rebuildSpatial();
            w.resetMotion();
            const slot = 'qa-alien-preview';
            localStorage.setItem('ashen-road-save:' + slot, new Expedition(w).save());
            location.href = './?slot=' + slot;
          } catch (error) {
            const p = document.createElement('p');
            p.textContent = error.message;
            document.querySelector('main').append(p);
          }
        };
        document.querySelector('#scenes').append(b);
      }
    </script>
  </body>
</html>
