<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Watersheds and Districts</title
  ><link rel="stylesheet" href="../../src/ui/game.css" /><style>
    body {
      overflow: auto;
      background: #15221d;
      color: #dfd4b7;
      padding: 24px;
    }
    main {
      max-width: 1450px;
      margin: auto;
    }
    canvas {
      width: 100%;
      height: auto;
      border: 1px solid #7d866b66;
      background: #1e3029;
    }
    section {
      margin-top: 24px;
    }
    .cities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .toolbar {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    small {
      display: block;
      color: #a8b3a1;
      margin: 8px 0;
    }
    input {
      max-width: 200px;
    }
    #status {
      min-height: 24px;
    }
  </style>
  <main>
    <div class="eyebrow">ALPHA 14 · GENERATOR PREVIEW</div>
    <h1>Watersheds and Town Districts</h1>
    <div class="toolbar">
      <label>Seed <input id="seed" value="734291" /></label
      ><button id="generate">Create Region</button
      ><button id="play">Play in This Test World</button>
    </div>
    <p id="status"></p>
    <canvas id="region" width="1280" height="960"></canvas>
    <div id="cities" class="cities"></div>
    <h1>Forest Clearings and Trails</h1>
    <div id="camps" class="cities"></div>
  </main>
  <script type="module">
    import { World, W, H } from '../../src/core/simulation.js';
    import { Expedition } from '../../src/core/expedition.js';
    import { biomeColor } from '../../src/world/regional-terrain.js';
    import { RenderAssets } from '../../src/render/render-assets.js';
    let world;
    const $ = (s) => document.querySelector(s),
      colors = [
        '#35513b',
        '#89805a',
        '#335d65',
        '#969778',
        '#396b79',
        '#ad976e',
        '#7d8a50',
        '#21252d',
        '#89945c',
        '#456151',
        '#8b887b',
        '#586b70',
        '#b4b4a2',
        '#83745d',
        '#93866c',
        '#bba376',
        '#796289',
        '#5e6270',
        '#8c9a92',
        '#7c6c4c',
      ];
    function render() {
      const start = performance.now();
      try {
        world = new World($('#seed').value);
        const image = document.createElement('canvas');
        image.width = W;
        image.height = H;
        const c = image.getContext('2d'),
          pixels = c.createImageData(W, H);
        for (let i = 0; i < W * H; i++) {
          const color = biomeColor(world, i) || colors[world.tiles[i]];
          pixels.data[i * 4] = parseInt(color.slice(1, 3), 16);
          pixels.data[i * 4 + 1] = parseInt(color.slice(3, 5), 16);
          pixels.data[i * 4 + 2] = parseInt(color.slice(5, 7), 16);
          pixels.data[i * 4 + 3] = 255;
        }
        c.putImageData(pixels, 0, 0);
        for (const b of world.buildings) {
          c.fillStyle = b.style?.[b.type === 'wall' ? 'wall' : 'house'] || '#b3b19d';
          c.fillRect(b.x, b.y, b.w, b.h);
        }
        const out = $('#region').getContext('2d');
        out.drawImage(image, 0, 0);
        out.font = 'bold 13px system-ui';
        out.textAlign = 'center';
        for (const p of [
          ...world.cities,
          world.places.find((z) => z.id === 'cathedral'),
          ...world.places.filter((z) => ['new-arktaria', 'emralaan'].includes(z.id)),
        ]) {
          out.fillStyle = '#111c16';
          out.fillText(p.name, p.x, p.y - p.r - 8);
          out.fillStyle = '#e3d5ac';
          out.fillText(p.name, p.x, p.y - p.r - 9);
        }
        $('#cities').replaceChildren();
        for (const z of world.cities) {
          const section = document.createElement('section'),
            title = document.createElement('h2');
          title.textContent = z.name;
          const caption = document.createElement('small');
          caption.textContent =
            { capital: 'Large City', town: 'Town', village: 'Village' }[z.kind] +
            ' · ' +
            z.wardPlan.wards.length +
            ' districts · ' +
            z.houseCount +
            ' houses';
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 600;
          const context = canvas.getContext('2d'),
            size = Math.max(z.rx, z.ry) * 2 + 16;
          context.imageSmoothingEnabled = false;
          context.drawImage(image, z.x - size / 2, z.y - size / 2, size, size, 0, 0, 600, 600);
          section.append(title, caption, canvas);
          $('#cities').append(section);
        }
        $('#camps').replaceChildren();
        const assets = new RenderAssets(world);
        for (const trail of world.forestTrails || []) {
          const z = world.places.find((z) => z.id === trail.camp),
            section = document.createElement('section'),
            title = document.createElement('h2'),
            canvas = document.createElement('canvas');
          title.textContent = z.name;
          canvas.width = canvas.height = 600;
          const c = canvas.getContext('2d'),
            xs = [z.x, trail.junction.x / 48],
            ys = [z.y, trail.junction.y / 48],
            size = Math.max(Math.abs(xs[0] - xs[1]), Math.abs(ys[0] - ys[1])) + 55,
            left = Math.max(0, Math.min(W - size, (xs[0] + xs[1] - size) / 2)),
            top = Math.max(0, Math.min(H - size, (ys[0] + ys[1] - size) / 2)),
            scale = 600 / (size * 48);
          c.save();
          c.scale(scale, scale);
          c.translate(-left * 48, -top * 48);
          assets.drawGround(
            c,
            {
              left: left * 48,
              right: (left + size) * 48,
              top: top * 48,
              bottom: (top + size) * 48,
            },
            1,
            0,
          );
          for (const t of world
            .treesNear({ x: (left + size / 2) * 48, y: (top + size / 2) * 48 }, size * 48)
            .sort((a, b) => a.y - b.y))
            assets.tree(c, t);
          for (const b of world.buildings.filter((b) => b.camp === z.id)) {
            c.fillStyle = b.campStyle === 0 ? '#9b6852' : b.campStyle === 1 ? '#7f8162' : '#81708b';
            c.beginPath();
            c.moveTo(b.x * 48, (b.y + b.h) * 48);
            c.lineTo((b.x + b.w / 2) * 48, b.y * 48 - 30);
            c.lineTo((b.x + b.w) * 48, (b.y + b.h) * 48);
            c.fill();
          }
          c.restore();
          section.append(title, canvas);
          $('#camps').append(section);
        }
        assets.dispose();
        $('#status').textContent =
          'Rivers and segments: ' +
          world.riverPaths.length +
          ' · Natural lakes: ' +
          world.lakes.length +
          ' · Generation: ' +
          Math.round(performance.now() - start) +
          ' ms · Old saves use the previous generator.';
      } catch (error) {
        $('#status').textContent = error.stack;
      }
    }
    $('#generate').onclick = render;
    $('#play').onclick = () => {
      try {
        localStorage.setItem('ashen-road-save:qa-generation-preview', new Expedition(world).save());
        location.href = './?slot=qa-generation-preview';
      } catch (error) {
        $('#status').textContent = error.message;
      }
    };
    render();
  </script>
</html>
