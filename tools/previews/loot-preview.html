<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Nearby Loot Preview</title
  ><link rel="stylesheet" href="../../src/ui/game.css" /><style>
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 30%, #455a3b, #182b23);
    }
    .preview-summary {
      position: fixed;
      left: 20px;
      top: 20px;
      max-width: 245px;
      background: #14211fe8;
      border: 1px solid #c5ae7855;
      padding: 15px;
      line-height: 1.7;
    }
    .modal-card {
      position: absolute;
      top: 4vh;
      left: 50%;
      transform: translateX(-50%);
      max-height: 92vh;
      width: 650px;
    }
    .modal-card h1 {
      font-size: 30px;
    }
    .loot-source {
      padding: 12px;
      margin: 12px 0;
    }
    .loot-source-heading h3 {
      font-size: 20px;
    }
    .loot-all {
      bottom: -32px;
    }
  </style>
  <aside class="preview-summary">
    <div class="eyebrow">SHARED LOOT WINDOW TEST</div>
    <p>Two bodies lie beside the player.</p>
    <strong>In the Bag</strong>
    <div id="bag">Empty</div>
  </aside>
  <main class="modal-card"><div id="loot-panel"></div></main>
  <script type="module">
    import { World } from '../../src/core/simulation.js';
    import { renderLootPanel } from '../../src/ui/loot-panel.js';
    import { ITEMS } from '../../src/core/content.js';
    const w = new World('loot-preview'),
      p = w.player;
    w.corpses = [
      {
        id: 90001,
        name: 'Red Foxes Bandit',
        x: p.x + 10,
        y: p.y,
        inventory: { arrow: 12, gold: 17 },
      },
      {
        id: 90002,
        name: 'Caravan Swordsman',
        x: p.x - 15,
        y: p.y,
        inventory: { sword: 1, ration: 3 },
      },
    ];
    w.landmarks = [];
    w.woodPiles = [];
    p.inventory = {};
    const changed = () =>
      (document.querySelector('#bag').textContent =
        Object.entries(p.inventory)
          .map(([k, n]) => ITEMS[k].name + ' × ' + n)
          .join(' · ') || 'Empty');
    renderLootPanel(document.querySelector('#loot-panel'), w, w.corpses[0], {
      onChange: changed,
      onTakeAll: () => {
        document.querySelector('main').classList.add('hidden');
        document.querySelector('.preview-summary p').textContent =
          'All loot collected. Window closed.';
      },
    });
  </script>
</html>
